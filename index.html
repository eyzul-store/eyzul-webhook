<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyzulstore 🦋</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #f5f5f7; padding: 20px; text-align: center; }
        .container { max-width: 440px; margin: 30px auto; background: #1a1a24; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #2e2e3f; text-align: left; }
        h2 { text-align: center; color: #50b6ff; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p.subtitle { text-align: center; color: #9898a0; font-size: 14px; margin-bottom: 25px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; margin-top: 15px; }
        input, select, button { width: 100%; padding: 14px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; margin-top: 5px; }
        input, select { background: #0f0f12; color: #fff; border: 1px solid #3a3a4e; transition: 0.2s; }
        input:focus, select:focus { border-color: #50b6ff; outline: none; }
        .flex-inputs { display: flex; gap: 10px; }
        .flex-inputs div { flex: 1; }
        button { background: #50b6ff; color: #000; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.2s; }
        button:hover { background: #3fa5ef; }
        button:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
        .status-msg { font-size: 12px; color: #50b6ff; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏪 Eyzulstore 🦋</h2>
    <p class="subtitle">Layanan Top-Up Game & Voucher Instan</p>
    
    <!-- 🆔 Input Form Section -->
    <div id="targetFormContainer">
        <label id="mainInputLabel" for="targetAccount">ID Akun Tujuan / Nomor HP</label>

            <option value="FF_720">Free Fire — 720 Diamonds (Rp 93.000)</option>
            <option value="FF_1440">Free Fire — 1440 Diamonds (Rp 185.000)</option>
        </optgroup>
        <optgroup label="PUBG Mobile">
            <option value="PUBG_60">PUBG Mobile — 60 UC (Rp 14.500)</option>
            <option value="PUBG_325">PUBG Mobile — 325 UC (Rp 71.000)</option>
            <option value="PUBG_660">PUBG Mobile — 660 UC (Rp 142.000)</option>
            <option value="PUBG_1800">PUBG Mobile — 1800 UC (Rp 355.000)</option>
        </optgroup>
        <optgroup label="Honor of Kings (HOK)">
            <option value="HOK_80">Honor of Kings — 80 Tokens (Rp 16.000)</option>
            <option value="HOK_240">Honor of Kings — 240 Tokens (Rp 47.500)</option>
            <option value="HOK_400">Honor of Kings — 400 Tokens (Rp 78.000)</option>
            <option value="HOK_800">Honor of Kings — 800 Tokens (Rp 155.000)</option>
        </optgroup>
        <optgroup label="Genshin Impact">
            <option value="GENSHIN_60">Genshin Impact — 60 Crystals (Rp 16.500)</option>
            <option value="GENSHIN_300">Genshin Impact — 300 Crystals (Rp 79.000)</option>
            <option value="GENSHIN_980">Genshin Impact — 980 Crystals (Rp 239.000)</option>
            <option value="GENSHIN_WM">Genshin Impact — Welkin Moon Blessing (Rp 79.000)</option>
        </optgroup>
        <optgroup label="E-Wallet Top-Up">
            <option value="DANA_20">Dana — Saldo Rp 20.000 (Rp 21.500)</option>
            <option value="DANA_50">Dana — Saldo Rp 50.000 (Rp 51.200)</option>
            <option value="DANA_100">Dana — Saldo Rp 100.000 (Rp 100.900)</option>
            <option value="GOPAY_20">GoPay — Saldo Rp 20.000 (Rp 21.500)</option>
            <option value="GOPAY_50">GoPay — Saldo Rp 50.000 (Rp 51.200)</option>
        </optgroup>
        <optgroup label="Pulsa Isi Ulang">
            <option value="TSEL_20">Pulsa Telkomsel — Rp 20.000 (Rp 20.900)</option>
            <option value="TSEL_50">Pulsa Telkomsel — Rp 50.000 (Rp 50.500)</option>
            <option value="ISAT_20">Pulsa Indosat — Rp 20.000 (Rp 21.000)</option>
            <option value="XL_20">Pulsa XL Axiata — Rp 20.000 (Rp 21.100)</option>
        </optgroup>
    </select>
    <span id="syncStatus" class="status-msg">🔄 Mengambil data katalog...</span>

    <button id="orderBtn" onclick="submitResellerOrder()">Beli Sekarang</button>
</div>

// Start setting up items locally to clear the warning banner error instantly
document.addEventListener("DOMContentLoaded", () => {
    const syncStatus = document.getElementById('syncStatus');
    syncStatus.innerText = "✅ Semua game terupdate otomatis & siap surfing!";
    syncStatus.style.color = "#4caf50";
});

// Smart UI toggler that automatically triggers server boxes for special games
function handleProductChange() {
    const selection = document.getElementById('productCode').value;
    const zoneBox = document.getElementById('zoneIdBox');
    const mainLabel = document.getElementById('mainInputLabel');
    const mainInput = document.getElementById('targetAccount');

    if (!selection) return;

    if (selection.startsWith("ML_BB")) {
        mainLabel.innerText = "Data Akun Mobile Legends";
        mainInput.placeholder = "User ID (12345678)";
        zoneBox.style.display = "block";
    } else if (selection.startsWith("DANA") || selection.startsWith("GOPAY") || selection.startsWith("TSEL") || selection.startsWith("ISAT") || selection.startsWith("XL")) {
        mainLabel.innerText = "Nomor Handphone Tujuan";
        mainInput.placeholder = "Contoh: 081234567890";
        zoneBox.style.display = "none";
    } else {
        mainLabel.innerText = "Target ID / Karakter Akun";
        mainInput.placeholder = "Masukkan Player ID Akun";
        zoneBox.style.display = "none";
    }
}
