<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyzulstore 🦋</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #f5f5f7; padding: 20px; text-align: center; }
        .container { max-width: 440px; margin: 30px auto; background: #1a1a24; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #2e2e3f; text-align: left; }
        h2 { text-align: center; color: #50b6ff; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p.subtitle { text-align: center; color: #9898a0; font-size: 14px; margin-bottom: 25px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; margin-top: 15px; }
        input, select, button { width: 100%; padding: 14px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; margin-top: 5px; }
        input, select { background: #0f0f12; color: #fff; border: 1px solid #3a3a4e; transition: 0.2s; }
        input:focus, select:focus { border-color: #50b6ff; outline: none; }
        .flex-inputs { display: flex; gap: 10px; }
        .flex-inputs div { flex: 1; }
        button { background: #50b6ff; color: #000; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.2s; }
        button:hover { background: #3fa5ef; }
        button:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
        .status-msg { font-size: 12px; color: #50b6ff; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏪 Eyzulstore 🦋</h2>
    <p class="subtitle">Layanan Top-Up Game & Voucher Instan</p>
    
    <!-- Dynamic Target Section -->
    <div id="targetFormContainer">
        <label id="mainInputLabel" for="targetAccount">ID Akun Tujuan / Nomor HP</label>
        <div class="flex-inputs">
            <div id="userIdBox">
                <input type="text" id="targetAccount" placeholder="Contoh: 12345678" required>
            </div>
            <div id="zoneIdBox" style="display: none;">
                <input type="text" id="targetZone" placeholder="Zona/Server (1234)">
            </div>
        </div>
    </div>
    
    <!-- Dynamic Product Menu -->
    <label for="productCode">Pilih Produk & Nominal</label>
    <select id="productCode" onchange="handleProductChange()">
        <option value="">-- Memuat Semua Produk Live... --</option>
    </select>
    <span id="syncStatus" class="status-msg">🔄 Menghubungkan ke katalog live...</span>

    <button id="orderBtn" onclick="submitResellerOrder()" disabled>Beli Sekarang</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", loadFullLiveCatalog);
let completeInventoryMap = {};

async function loadFullLiveCatalog() {
    const dropdown = document.getElementById('productCode');
    const syncStatus = document.getElementById('syncStatus');
    const orderBtn = document.getElementById('orderBtn');

    try {
        const res = await fetch('/api/get-catalog');
        const data = await res.json();

        if (data.success && data.products.length > 0) {
            dropdown.innerHTML = '<option value="">-- Pilih Paket Topup Game --</option>';
            
            // Categorize array items neatly by game group structure
            let groupedItems = {};
            data.products.forEach(item => {
                let categoryName = item.game_name || item.category || "Voucher / Lainnya";
                if (!groupedItems[categoryName]) groupedItems[categoryName] = [];
                groupedItems[categoryName].push(item);
            });

            // Render categories and items dynamically onto the select layout
            for (let category in groupedItems) {
                const group = document.createElement('optgroup');
                group.label = category;
                
                groupedItems[category].forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.code;
                    const cleanPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(item.price);
                    option.textContent = `${item.name} (${cleanPrice})`;
                    group.appendChild(option);

                    // Track details for invoice routing operations
                    completeInventoryMap[item.code] = {
                        price: item.price,
                        name: `${category} ${item.name}`,
                        game: category.toLowerCase()
                    };
                });
                dropdown.appendChild(group);
            }

            syncStatus.innerText = "✅ Semua game terupdate otomatis & siap surfing!";
            syncStatus.style.color = "#4caf50";
            orderBtn.disabled = false;
        } else {
            throw new Error("Empty data container");
        }
    } catch (err) {
        console.error(err);
        dropdown.innerHTML = '<option value="">Gagal memuat katalog live. Segera refresh.</option>';
        syncStatus.innerText = "⚠️ Gagal tersambung otomatis dengan catalog Sekalipay.";
        syncStatus.style.color = "#ffdd00";
    }
}

function handleProductChange() {
    const selection = document.getElementById('productCode').value;
    const zoneBox = document.getElementById('zoneIdBox');
    const mainLabel = document.getElementById('mainInputLabel');
    const mainInput = document.getElementById('targetAccount');

    if (!selection || !completeInventoryMap[selection]) return;
    
    const activeItem = completeInventoryMap[selection];

    // Smart Input Modifier: Adapts labels and split input boxes dynamically based on game types
    if (activeItem.game.includes("mobile legends") || activeItem.game.includes("mlbb")) {
        mainLabel.innerText = "Data Akun Mobile Legends";
        mainInput.placeholder = "User ID (Contoh: 12345678)";
        zoneBox.style.display = "block";
    } else if (activeItem.game.includes("dana") || activeItem.game.includes("pulsa") || activeItem.game.includes("gopay") || activeItem.game.includes("ovo")) {
        mainLabel.innerText = "Nomor Handphone Tujuan";
        mainInput.placeholder = "Contoh: 081234567890";
        zoneBox.style.display = "none";
    } else {
        mainLabel.innerText = "Target ID / Karakter Akun";
        mainInput.placeholder = "Masukkan Player ID Akun";
        zoneBox.style.display = "none";
    }
}

async function submitResellerOrder() {
    const orderBtn = document.getElementById('orderBtn');
    const idInput = document.getElementById('targetAccount').value.trim();
    const zoneInput = document.getElementById('targetZone').value.trim();
    const selectedProduct = document.getElementById('productCode').value;

    if (!idInput) {
        alert("Mohon isi nomor ID akun / Nomor HP target!");
        return;
    }

    const activeItem = completeInventoryMap[selectedProduct];
    
    // Automatically compile standard unified string markers for H2H systems
    let calculatedTarget = idInput;
    if (activeItem.game.includes("mobile legends") || activeItem.game.includes("mlbb")) {
        if (!zoneInput) {
            alert("Mohon masukkan Zone ID/Server Game kamu!");
            return;
        }
        calculatedTarget = `${idInput}(${zoneInput})`;
    }

    orderBtn.innerText = "Membuka Kasir Pembayaran...";
    orderBtn.disabled = true;

    try {
        const response = await fetch('/api/create-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                priceAmount: activeItem.price,
                targetId: calculatedTarget,
                productName: activeItem.name
            })
        });

        const result = await response.json();

        if (result.success && result.paymentUrl) {
            window.location.href = result.paymentUrl;
        } else {
            alert("Gagal memproses pembayaran: " + (result.message || "Periksa kembali data Anda."));
            orderBtn.innerText = "Beli Sekarang";
            orderBtn.disabled = false;
        }
    } catch (err) {
        console.error(err);
        alert("Terjadi gangguan komunikasi data.");
        orderBtn.innerText = "Beli Sekarang";
        orderBtn.disabled = false;
    }
}
</script>

</body>
</html>
