<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyzulstore - Reseller Center 🦋</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #f5f5f7; padding: 20px; text-align: center; }
        .container { max-width: 420px; margin: 40px auto; background: #1a1a24; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #2e2e3f; }
        h2 { margin-bottom: 5px; color: #50b6ff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p { color: #9898a0; font-size: 14px; margin-bottom: 25px; }
        label { display: block; text-align: left; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
        input, select, button { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
        input, select { background: #0f0f12; color: #fff; border: 1px solid #3a3a4e; transition: 0.2s; }
        input:focus, select:focus { border-color: #50b6ff; outline: none; }
        button { background: #50b6ff; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #3fa5ef; }
        button:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
        .loading-text { font-size: 12px; color: #50b6ff; text-align: left; margin-top: -15px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏪 Eyzulstore 🦋</h2>
    <p>Layanan Top-Up Game & Voucher Instan</p>
    
    <label for="targetAccount">Target ID Akun (Game ID / Nomor Tujuan)</label>
    <input type="text" id="targetAccount" placeholder="Contoh: 12345678 (2345)" required>
    
    <label for="productCode">Pilih Produk & Nominal Game</label>
    <select id="productCode">
        <option value="">-- Memuat Produk Live Sekalipay... --</option>
    </select>
    <span id="syncStatus" class="loading-text">🔄 Mengambil produk terbaru...</span>

    <button id="orderBtn" onclick="submitResellerOrder()" disabled>Beli Sekarang</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", fetchLiveProducts);
let productListPriceMap = {};

async function fetchLiveProducts() {
    const dropdown = document.getElementById('productCode');
    const syncStatus = document.getElementById('syncStatus');
    const orderBtn = document.getElementById('orderBtn');

    try {
        const res = await fetch('/api/get-catalog');
        const data = await res.json();

        if (data.success && data.products.length > 0) {
            dropdown.innerHTML = '<option value="">-- Pilih Paket Game Kamu --</option>';
            data.products.forEach(item => {
                const formattedPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(item.price);
                const option = document.createElement('option');
                option.value = item.code;
                option.textContent = `${item.game_name || item.category} — ${item.name} (${formattedPrice})`;
                dropdown.appendChild(option);
                productListPriceMap[item.code] = { price: item.price, name: `${item.game_name} ${item.name}` };
            });
            syncStatus.innerText = "✅ Semua game terupdate otomatis & siap surfing!";
            syncStatus.style.color = "#4caf50";
            orderBtn.disabled = false;
        } else {
            dropdown.innerHTML = '<option value="">Gagal memuat produk. Refresh halaman.</option>';
            syncStatus.innerText = "⚠️ Gagal tersambung otomatis dengan catalog Sekalipay.";
            syncStatus.style.color = "#ffdd00";
        }
    } catch (err) {
        console.error(err);
        dropdown.innerHTML = '<option value="">Gagal memuat sistem.</option>';
    }
}

async function submitResellerOrder() {
    const orderBtn = document.getElementById('orderBtn');
    const targetInput = document.getElementById('targetAccount').value.trim();
    const selectedProduct = document.getElementById('productCode').value;

    if (!selectedProduct) {
        alert("Silahkan pilih produk game terlebih dahulu!");
        return;
    }
    if (!targetInput) {
        alert("Mohon masukkan target ID akun pengguna!");
        return;
    }

    orderBtn.innerText = "Membuka Kasir Pembayaran...";
    orderBtn.disabled = true;

    try {
        const currentSelection = productListPriceMap[selectedProduct];
        const response = await fetch('/api/create-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                priceAmount: currentSelection.price,
                targetId: targetInput,
                productName: currentSelection.name
            })
        });

        const result = await response.json();

        if (result.success && result.paymentUrl) {
            window.location.href = result.paymentUrl;
        } else {
            alert("Gagal memproses kasir: " + (result.message || "Periksa konfigurasi API Key Anda."));
            orderBtn.innerText = "Beli Sekarang";
            orderBtn.disabled = false;
        }
    } catch (err) {
        console.error(err);
        alert("Terjadi masalah komunikasi data ke backend gateway.");
        orderBtn.innerText = "Beli Sekarang";
        orderBtn.disabled = false;
    }
}
</script>

</body>
</html>
