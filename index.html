<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyzulstore - Top-Up Digital</title>
    <!-- Menggunakan Bootstrap & FontAwesome untuk reka bentuk kedai yang sangat kemas dan moden -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1e293b; border-bottom: 2px solid #334155; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid #475569; color: #ffffff; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; border-color: #38bdf8; color: #ffffff; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25); }
        .btn-primary-custom { background: linear-gradient(135deg, #38bdf8, #0284c7); border: none; color: white; font-weight: 600; padding: 12px; border-radius: 8px; transition: all 0.3s; }
        .btn-primary-custom:hover { background: linear-gradient(135deg, #0284c7, #0369a1); transform: translateY(-2px); }
        footer { margin-top: 50px; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Header / Navbar Kedai -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container py-2 justify-content-center">
            <a class="navbar-brand fw-bold text-info fs-3" href="#"><i class="fa-solid fa-gamepad me-2"></i>EYZULSTORE</a>
        </div>
    </nav>

    <!-- Kandungan Utama Form Pembelian -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <!-- Kotak Amaran Kuning Sekiranya Sistem Gagal Sambung -->
                <div id="error-message" class="alert alert-warning border-warning shadow-sm mb-4" style="display: none; background-color: #fef08a; color: #713f12;">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> <strong>Gagal menarik seluruh menu database.</strong> Sila semak sambungan API Key biskita.
                </div>

                <div class="card card-custom p-4">
                    <h4 class="fw-bold mb-4 text-center text-light"><i class="fa-solid fa-cart-shopping me-2 text-info"></i>Formulir Top-Up Digital</h4>
                    
                    <!-- Pilihan Kategori Layanan -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-layer-group me-2 text-secondary"></i>1. Pilih Layanan / Produk</label>
                        <select id="product-select" class="form-select form-select-lg">
                            <option value="">-- Memuatkan menu produk... --</option>
                        </select>
                    </div>

                    <!-- Input ID Target Pengguna -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold"><i class="fa-solid fa-id-card me-2 text-secondary"></i>2. Masukkan ID Sasaran / No HP</label>
                        <input type="text" id="target-id" class="form-control form-control-lg" placeholder="Contoh: 12345678 (9923) atau 0123456789">
                        <div class="form-text text-muted">Pastikan format ID sasaran biskita dimasukkan dengan betul.</div>
                    </div>

                    <!-- Butang Pengesahan Pembelian -->
                    <button onclick="prosesTransaksi()" class="btn btn-primary-custom w-100 btn-lg shadow">
                        <i class="fa-solid fa-wallet me-2"></i> Beli & Bayar Sekarang
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer Kedai -->
    <footer class="text-center py-4">
        <div class="container">
            <p>&copy; 2026 <strong>Eyzulstore</strong>. Hak Cipta Terpelihara.</p>
        </div>
    </footer>

    <!-- Logik Pengaturcaraan JavaScript Penghubung Sistem Vercel -->
    <script>
        // Pautan Domain Utama Vercel Biskita Yang Sudah Sah Hijau [image_V1fU-u.png]
        const BACKEND_URL = 'https://vercel.app';

        // 1. Fungsi Utama Mengambil Senarai Katalog Produk
        async function muatKatalogLayanan() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/get-catalog`);
                const data = await res.json();
                
                const selectElement = document.getElementById('product-select');
                selectElement.innerHTML = '<option value="">-- Sila Pilih Layanan --</option>';
                
                // Semak jika data katalog wujud dan berjaya ditarik
                if (data && data.status !== false && (Array.isArray(data) || data.data)) {
                    const senaraiProduk = Array.isArray(data) ? data : data.data;
                    
                    senaraiProduk.forEach(item => {
                        let opt = document.createElement('option');
                        opt.value = item.price || item.harga || '0'; 
                        opt.innerText = `${item.name || item.layanan} - Rp ${Number(item.price || item.harga).toLocaleString('id-ID')}`;
                        selectElement.appendChild(opt);
                    });
                } else {
                    document.getElementById('error-message').style.display = 'block';
                }
            } catch (err) {
                console.error('Ralat Katalog:', err);
                document.getElementById('error-message').style.display = 'block';
            }
        }

        // 2. Fungsi Utama Memproses Pembelian & Menjana Resit Pembayaran
        async function prosesTransaksi() {
            const price = document.getElementById('product-select').value;
            const target = document.getElementById('target-id').value;
            const selectEl = document.getElementById('product-select');
            const productName = selectEl.options[selectEl.selectedIndex].text;

            if (!price || !target) {
                alert('Harap maaf biskita, sila pilih produk dan isi ID sasaran terlebih dahulu!');
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/create-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        priceAmount: price,
                        targetId: target,
                        productName: productName || 'Pembelian Layanan'
                    })
                });
                
                const data = await res.json();
                
                if (data && (data.payment_url || data.url || (data.data && data.data.payment_url))) {
                    const urlBayar = data.payment_url || data.url || data.data.payment_url;
                    window.location.href = urlBayar; 
                } else {
                    alert('Gagal menjana transaksi. Sila pastikan baki akaun biskita mencukupi.');
                }
            } catch (err) {
                console.error('Ralat Pembayaran:', err);
                alert('Ralat sistem pembayaran. Sila hubungi admin kedai biskita.');
            }
        }

        // Jalankan fungsi memanggil data sebaik sahaja browser memuatkan kedai
        window.onload = muatKatalogLayanan;
    </script>
</body>
</html>
