<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyzulstore 🦋</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f12; color: #f5f5f7; padding: 20px; text-align: center; }
        .container { max-width: 420px; margin: 40px auto; background: #1a1a24; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #2e2e3f; }
        h2 { margin-bottom: 5px; color: #50b6ff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        p { color: #9898a0; font-size: 14px; margin-bottom: 25px; }
        label { display: block; text-align: left; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
        input, select, button { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
        input, select { background: #0f0f12; color: #fff; border: 1px solid #3a3a4e; transition: 0.2s; }
        input:focus, select:focus { border-color: #50b6ff; outline: none; }
        button { background: #50b6ff; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #3fa5ef; }
        button:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏪 Eyzulstore 🦋</h2>
    <p>Layanan Top-Up Game & Voucher Instan</p>
    
    <label for="targetAccount">Target ID Akun (Game ID / Nomor Tujuan)</label>
    <input type="text" id="targetAccount" placeholder="Contoh: 12345678 (2345)" required>
    
    <label for="productCode">Pilih Produk & Nominal Game</label>
    <select id="productCode">
        <!-- 🎮 ALL MAJOR RESELLER GAMES HARDCODED DIRECTLY -->
        <optgroup label="Mobile Legends (MLBB)">
            <option value="ML_BB_86">Mobile Legends — 86 Diamonds (Rp 20.000)</option>
            <option value="ML_BB_172">Mobile Legends — 172 Diamonds (Rp 40.000)</option>
            <option value="ML_BB_257">Mobile Legends — 257 Diamonds (Rp 60.000)</option>
            <option value="ML_BB_WTP">Mobile Legends — Weekly Diamond Pass (Rp 28.000)</option>
        </optgroup>
        <optgroup label="Free Fire (FF)">
            <option value="FF_140">Free Fire — 140 Diamonds (Rp 19.000)</option>
            <option value="FF_355">Free Fire — 355 Diamonds (Rp 47.000)</option>
            <option value="FF_720">Free Fire — 720 Diamonds (Rp 93.000)</option>
        </optgroup>
        <optgroup label="PUBG Mobile">
            <option value="PUBG_60">PUBG Mobile — 60 UC (Rp 14.500)</option>
            <option value="PUBG_325">PUBG Mobile — 325 UC (Rp 71.000)</option>
            <option value="PUBG_660">PUBG Mobile — 660 UC (Rp 142.000)</option>
        </optgroup>
        <optgroup label="Honor of Kings (HOK)">
            <option value="HOK_80">Honor of Kings — 80 Tokens (Rp 16.000)</option>
            <option value="HOK_240">Honor of Kings — 240 Tokens (Rp 47.500)</option>
            <option value="HOK_400">Honor of Kings — 400 Tokens (Rp 78.000)</option>
        </optgroup>
        <optgroup label="Genshin Impact">
            <option value="GENSHIN_60">Genshin Impact — 60 Crystals (Rp 16.500)</option>
            <option value="GENSHIN_300">Genshin Impact — 300 Crystals (Rp 79.000)</option>
            <option value="GENSHIN_WM">Genshin Impact — Welkin Moon (Rp 79.000)</option>
        </optgroup>
        <optgroup label="E-Wallet & Pulsa Telkomsel">
            <option value="DANA_20">Dana — Saldo Rp 20.000 (Rp 21.500)</option>
            <option value="DANA_50">Dana — Saldo Rp 50.000 (Rp 51.200)</option>
            <option value="TSEL_20">Pulsa Telkomsel — Rp 20.000 (Rp 20.900)</option>
        </optgroup>
    </select>

    <button id="orderBtn" onclick="submitResellerOrder()">Beli Sekarang</button>
</div>

<script>
// Static mapper holding real item parameters to build checkout invoice amounts instantly
const internalPriceCatalog = {
    "ML_BB_86": { price: 20000, name: "Mobile Legends 86 Diamonds" },
    "ML_BB_172": { price: 40000, name: "Mobile Legends 172 Diamonds" },
    "ML_BB_257": { price: 60000, name: "Mobile Legends 257 Diamonds" },
    "ML_BB_WTP": { price: 28000, name: "Mobile Legends Weekly Diamond Pass" },
    "FF_140": { price: 19000, name: "Free Fire 140 Diamonds" },
    "FF_355": { price: 47000, name: "Free Fire 355 Diamonds" },
    "FF_720": { price: 93000, name: "Free Fire 720 Diamonds" },
    "PUBG_60": { price: 14500, name: "PUBG Mobile 60 UC" },
    "PUBG_325": { price: 71000, name: "PUBG Mobile 325 UC" },
    "PUBG_660": { price: 142000, name: "PUBG Mobile 660 UC" },
    "HOK_80": { price: 16000, name: "Honor of Kings 80 Tokens" },
    "HOK_240": { price: 47500, name: "Honor of Kings 240 Tokens" },
    "HOK_400": { price: 78000, name: "Honor of Kings 400 Tokens" },
    "GENSHIN_60": { price: 16500, name: "Genshin Impact 60 Genesis Crystals" },
    "GENSHIN_300": { price: 79000, name: "Genshin Impact 300 Genesis Crystals" },
    "GENSHIN_WM": { price: 79000, name: "Genshin Impact Welkin Moon Blessing" },
    "DANA_20": { price: 21500, name: "Topup Saldo Dana 20K" },
    "DANA_50": { price: 51200, name: "Topup Saldo Dana 50K" },
    "TSEL_20": { price: 20900, name: "Pulsa Telkomsel 20K" }
};

async function submitResellerOrder() {
    const orderBtn = document.getElementById('orderBtn');
    const targetInput = document.getElementById('targetAccount').value.trim();
    const selectedProduct = document.getElementById('productCode').value;

    if (!targetInput) {
        alert("Mohon masukkan target ID akun atau nomor HP pembeli!");
        return;
    }

    orderBtn.innerText = "Membuka Kasir Pembayaran...";
    orderBtn.disabled = true;

    try {
        const itemDetails = internalPriceCatalog[selectedProduct];

        // Send parameters straight to the create-payment server cashier script
        const response = await fetch('/api/create-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                priceAmount: itemDetails.price,
                targetId: targetInput,
                productName: itemDetails.name
            })
        });

        const result = await response.json();

        if (result.success && result.paymentUrl) {
            window.location.href = result.paymentUrl;
        } else {
            alert("Gagal memproses kasir: " + (result.message || "Periksa konfigurasi Vercel API Key Anda."));
            orderBtn.innerText = "Beli Sekarang";
            orderBtn.disabled = false;
        }
    } catch (err) {
        console.error(err);
        alert("Terjadi masalah komunikasi data ke backend gateway.");
        orderBtn.innerText = "Beli Sekarang";
        orderBtn.disabled = false;
    }
}
</script>

</body>
</html>
